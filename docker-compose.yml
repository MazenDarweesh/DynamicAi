version: '3.8'

services:
  # --------------------------------------------------------------------------
  # DynamicAI Application (Backend + Frontend)
  # --------------------------------------------------------------------------
  dynamicai-app:
    image: mazendarweesh/dynamicai:v2.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dynamicai-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # ============================================
      # Local Development Database Configuration
      # ============================================
      # Uses the local SA_PASSWORD from .env
      - ConnectionStrings__AppDbContextConnection=Server=sqlserver;Database=DynamicAi_AppDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;

      # For dev, defaults to the env var PRODUCTION_DB_CONNECTION_STRING
      # If not set, you must provide it in your .env file
      - ConnectionStrings__DefaultConnection=${PRODUCTION_DB_CONNECTION_STRING}

      # Secrets (Set these in .env)
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Database__Name=${PRODUCTION_DB_NAME:-QualityControl}
      - Observability__OtlpEnabled=${Observability__OtlpEnabled:-false}
      - Observability__OtlpEndpoint=${Observability__OtlpEndpoint:-http://aspire-dashboard:18889}

    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - dynamicai-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # MOCK SQL Server for Local Development
  # --------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dynamicai-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - sqlvolume:/var/opt/mssql
    networks:
      - dynamicai-network
    healthcheck:
      # Using variable for password in healthcheck
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # .NET Aspire Dashboard (Local OpenTelemetry UI: Traces, Metrics, Logs)
  # --------------------------------------------------------------------------
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: dynamicai-aspire-dashboard
    profiles: ["observability"]
    ports:
      - "18888:18888"
      - "4317:18889"
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    networks:
      - dynamicai-network
    restart: unless-stopped

networks:
  dynamicai-network:
    driver: bridge

volumes:
  sqlvolume:
    driver: local
