version: '3.8'

services:
  # --------------------------------------------------------------------------
  # DynamicAI Application (Backend + Frontend)
  # --------------------------------------------------------------------------
  dynamicai-app:
    image: mazendarweesh/dynamicai:v1.9.0-QdrantOnPrem
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dynamicai-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # ============================================
      # Local Development Database Configuration
      # ============================================
      # Uses the local SA_PASSWORD from .env
      - ConnectionStrings__AppDbContextConnection=Server=sqlserver;Database=DynamicAi_AppDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;

      # For dev, defaults to the env var PRODUCTION_DB_CONNECTION_STRING
      # If not set, you must provide it in your .env file
      - ConnectionStrings__DefaultConnection=${PRODUCTION_DB_CONNECTION_STRING}

      # Secrets (Set these in .env)
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Qdrant__Host=${QDRANT_HOST}
      - Qdrant__ApiKey=${QDRANT_API_KEY}
      - Qdrant__CollectionName=${QDRANT_COLLECTION_NAME:-erp_knowledge_base_v3_indexed}
      - Database__Name=${PRODUCTION_DB_NAME:-QualityControl}

    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - dynamicai-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # MOCK SQL Server for Local Development
  # --------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dynamicai-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - sqlvolume:/var/opt/mssql
    networks:
      - dynamicai-network
    healthcheck:
      # Using variable for password in healthcheck
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  qdrant_local:
    image: qdrant/qdrant:latest
    container_name: dynamicai-qdrant-local
    environment:
      - QDRANT__STORAGE__OPTIMIZER__INDEXING_THRESHOLD=${QDRANT_OPTIMIZER_INDEXING_THRESHOLD:-100}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks:
      - dynamicai-network
    restart: unless-stopped

networks:
  dynamicai-network:
    driver: bridge

volumes:
  sqlvolume:
    driver: local
  qdrant_storage:
  qdrant_snapshots:
