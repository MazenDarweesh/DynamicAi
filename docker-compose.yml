# ============================================================================
# DynamicAI - Docker Compose Configuration
# For team testing and development
# ============================================================================
# Usage:
#   1. Copy .env.example to .env and fill in your secrets
#   2. Run: docker-compose up -d
#   3. Access: http://localhost:8080
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # DynamicAI Application (Backend + Frontend)
  # --------------------------------------------------------------------------
  dynamicai-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dynamicai-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Database connection (points to sqlserver service)
      - ConnectionStrings__AppDbContextConnection=Server=sqlserver;Database=DynamicAi_AppDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=QualityControl;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      # Gemini AI configuration
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Gemini__ChatModel=gemini-2.5-flash
      - Gemini__EmbeddingModel=gemini-embedding-001
      # Qdrant Cloud configuration
      - Qdrant__Host=${QDRANT_HOST}
      - Qdrant__ApiKey=${QDRANT_API_KEY}
      - Qdrant__CollectionName=erp_knowledge_base_v3_indexed
      # Database name for dynamic queries
      - Database__Name=QualityControl
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - dynamicai-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # SQL Server 2022 Database
  # --------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dynamicai-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql
    networks:
      - dynamicai-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

# ----------------------------------------------------------------------------
# Networks
# ----------------------------------------------------------------------------
networks:
  dynamicai-network:
    driver: bridge

# ----------------------------------------------------------------------------
# Volumes (Persistent Storage)
# ----------------------------------------------------------------------------
volumes:
  sqlvolume:
    driver: local
