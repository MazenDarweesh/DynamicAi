services:
  dynamicai-app:
    image: mazendarweesh/dynamicai:v2.1.1-dynamicai-health-observability
    container_name: dynamicai-app
    ports:
      - "9090:8080"
    environment:
      # ASP.NET Core Settings
      - ASPNETCORE_ENVIRONMENT=Development
      # ✅ Port 8080 required for non-root user 'appuser'
      - ASPNETCORE_URLS=http://+:8080
      - Logging__EnableContextAnalysisLogs=true
      - AllowedHosts=*

      # Connection Strings
      - ConnectionStrings__AppDbContextConnection=Server=sqlserver;Database=DynamicAi_AppDb;User Id=sa;Password=YourStr0ngP@ssw0rd123!;TrustServerCertificate=True;
      - ConnectionStrings__DefaultConnection=Server=66.94.98.79;Database=QualityControl;User Id=SchemaPipelineUser;Password=P@ssw0rdStr0ng!;MultipleActiveResultSets=True;TrustServerCertificate=True;Encrypt=False;

      # Gemini Configuration
      - Gemini__ApiKey=AIzaSyBi_XZrF0iLYzVB5GNzNhw5bltGc1dfBo4
      - Gemini__ChatModel=${GEMINI_CHAT_MODEL:-gemini-2.5-flash-lite}
      - Gemini__PredictModel=${GEMINI_PREDICT_MODEL:-gemini-2.5-flash-lite}
      - Gemini__EmbeddingModel=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}

      # Qdrant Configuration
      - Qdrant__Host=${QDRANT_HOST:-qdrant_local}
      - Qdrant__Port=${QDRANT_PORT:-6334}
      - Qdrant__ApiKey=${QDRANT_API_KEY:-}
      - Qdrant__CollectionName=erp_knowledge_base_v3_indexed
      - Qdrant__IntentCollectionName=intent_examples

      # Intent Router
      - IntentRouter__ConfidenceThreshold=0.75

      # Database Context
      - Database__Name=QualityControl

      # Features Control
      - Features__CondenserEnabled=${FEATURES_CONDENSER_ENABLED:-false}
      - Features__IntentClassificationEnabled=${FEATURES_INTENT_ENABLED:-false}
      - Features__DictionaryCompactFormatEnabled=true
      - Features__DirectedContextCompactEnabled=true
      - Features__PageDictionaryWarmerEnabled=false
      - Features__DbSchemaWarmerEnabled=false

      # Caching Strategies
      - Caching__QueryCache__Enabled=${CACHING_QUERY_ENABLED:-true}
      - Caching__QueryCache__CollectionName=query_cache
      - Caching__QueryCache__SimilarityThreshold=0.97
      - Caching__QueryCache__TTLDays=7

      - Caching__RagContextCache__Enabled=${CACHING_RAG_ENABLED:-true}
      - Caching__RagContextCache__TTLMinutes=240

      - Caching__SessionMemory__Enabled=${CACHING_SESSION_ENABLED:-true}
      - Caching__SessionMemory__TTLMinutes=30
      - Caching__SessionMemory__MaxHistoryTurns=5

      - Caching__GeminiCache__Enabled=${CACHING_GEMINI_ENABLED:-false}

      # Cost Control & Budgeting
      - LlmProviderPricing__ActiveProvider=Gemini
      - LlmProviderPricing__DailyBudgetUsd=1.00
      - LlmProviderPricing__WarningThresholdPercent=80
      - LlmProviderPricing__EnforceHardLimit=true
    healthcheck:
      test: [ "NONE" ]
    networks:
      - egdynamics-network
    restart: unless-stopped

  qdrant_local:
    image: qdrant/qdrant:latest
    container_name: dynamicai-qdrant
    environment:
      - QDRANT__STORAGE__OPTIMIZER__INDEXING_THRESHOLD=${QDRANT_OPTIMIZER_INDEXING_THRESHOLD:-100}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    networks:
      - egdynamics-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    restart: unless-stopped

networks:
  egdynamics-network:
    external: true
    name: 5189150146_egdynamics-network

volumes:
  qdrant_storage:
  qdrant_snapshots:

