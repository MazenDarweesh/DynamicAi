<div class="app-container">
  <div class="glass-layout">
    <!-- Sidebar -->
    <div class="sidebar" [class.closed]="!isSidebarOpen">
      <div class="sidebar-header">
        <img src="squareLogo.jpeg" alt="DynamicAi Logo" class="brand-logo">
        <div class="brand-name">DynamicAI</div>
      </div>

      <!-- New Chat Button -->
      <div class="new-chat-btn" (click)="resetChat()">
        <span>+</span> New Chat
      </div>

      <div class="history-list">
        <div class="history-label">Navigation</div>
        <!-- Navigation Items -->
        <div class="history-item" routerLink="/chat" routerLinkActive="active">
          💬 Chat
        </div>
        <div class="history-item" routerLink="/dashboard" routerLinkActive="active">
          📊 Dashboard
        </div>
        <div class="history-item" routerLink="/intent-review" routerLinkActive="active">
          🧠 Intent Review
        </div>
        <div class="history-item" routerLink="/training-data" routerLinkActive="active">
          📚 Training Data
        </div>
      </div>

      <div class="user-profile">
        <div class="profile-icon">👤</div>
        <div class="profile-info">
          <span class="name">User</span>
          <span class="status">Pro Plan</span>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
