<div class="app-container">
  <div class="glass-layout">
    <!-- Mobile Sidebar Backdrop -->
    <div class="mobile-sidebar-backdrop" *ngIf="isSidebarOpen" (click)="toggleSidebar()"></div>
    <!-- Sidebar -->
    <div class="sidebar" [class.closed]="!isSidebarOpen">
      <div class="sidebar-header">
        <img src="squareLogo.jpeg" alt="DynamicAi Logo" class="brand-logo">
        <div class="brand-name">DynamicAI</div>
      </div>

      <!-- New Chat Button -->
      <div class="new-chat-btn" (click)="resetChat()">
        <span>+</span> New Chat
      </div>

      <div class="history-list">
        <div class="history-label">Navigation</div>
        <!-- Navigation Items -->
        <div class="history-item" routerLink="/chat" routerLinkActive="active">
          💬 Chat
        </div>
        <div class="history-item" routerLink="/dashboard" routerLinkActive="active">
          📊 Dashboard
        </div>
        <div class="history-item" routerLink="/query-insights" routerLinkActive="active">
          🔍 Query Insights
        </div>
        <div class="history-item" routerLink="/intent-review" routerLinkActive="active">
          🧠 Intent Review
        </div>
        <div class="history-item" routerLink="/training-data" routerLinkActive="active">
          📚 Training Data
        </div>
        <div class="history-item" routerLink="/costs" routerLinkActive="active">
          💰 LLM Costs
        </div>
      </div>

      <div class="user-profile">
        <div class="profile-icon">👤</div>
        <div class="profile-info">
          <span class="name">User</span>
          <span class="status">Pro Plan</span>
        </div>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
      <header class="app-shell-header">
        <button class="menu-toggle" (click)="toggleSidebar()" title="Toggle Sidebar">
          ☰
        </button>
        <h1 class="page-title">{{ currentPageTitle }}</h1>
        <div class="header-spacer"></div>
        <div class="header-actions">
          <!-- Space for potential global actions -->
        </div>
      </header>
      <div class="router-wrapper">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>
</div>
