<div class="container">
  <div class="hero-section">
    <div class="logo-container">
      <img src="logo.png" alt="DynamicAI Logo" class="logo">
      <div class="glow"></div>
    </div>
    <h1 class="title">Dynamic<span class="gradient-text">AI</span></h1>
    <p class="subtitle">The Next Big Thing</p>
  </div>

  <div class="chat-container glass-panel">
    <div class="messages-area">
      <div *ngFor="let msg of messages" class="message" [class.user-message]="msg.isUser"
        [class.ai-message]="!msg.isUser">
        {{ msg.text }}
      </div>
    </div>
    <div class="input-area">
      <input [(ngModel)]="newMessage" (keyup.enter)="sendMessage()" type="text" class="input-field"
        placeholder="Ask me anything...">
      <button (click)="sendMessage()" class="btn-primary">Send</button>
    </div>
  </div>
</div>
